---
# handlers for ansible-role-docker-es_exporter

- name: Restart es_exporter
  ansible.builtin.service:
    name: Es_exporter
    state: restarted
    enabled: true

- name: Start es_exporter
  ansible.builtin.service:
    name: Es_exporter
    state: started
    enabled: true

- name: Reload es_exporter
  ansible.builtin.service:
    name: Es_exporter
    state: reloaded
    enabled: true
